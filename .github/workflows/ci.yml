name: CI

on:
  push:
    branches: [ main, master, 'clean-main', 'new-migration/*' ]
  pull_request:
    branches: [ main, master, 'clean-main' ]

jobs:
  tests:
    name: Tests - unit & integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install-hooks

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run tests (exclude slow/e2e)
        env:
          PYTHONWARNINGS: ignore::DeprecationWarning
        run: pytest -q -m "not slow"

  e2e:
    name: E2E UI (Playwright) [Optional]
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install deps & Playwright browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps
      - name: Run E2E Playwright tests (slow)
        run: pytest -q tests/e2e -m slow
