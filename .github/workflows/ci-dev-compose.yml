name: CI — Dev Docker Compose

on:
  push:
    branches: [ main, eco-system-init ]
  workflow_dispatch:

jobs:
  dev-compose-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.17.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: Bring up dev stack
        run: |
          docker-compose -f setup/docker-compose.dev.yml up --build -d
      - name: Wait for web
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8081/ >/dev/null; then echo "web ok" && break; else echo "waiting..."; sleep 2; fi
          done
      - name: Run tests
        run: |
          docker-compose -f setup/docker-compose.dev.yml exec -T web pytest -q tests/unit || true
      - name: Tear down
        if: always()
        run: |
          docker-compose -f setup/docker-compose.dev.yml down -v
