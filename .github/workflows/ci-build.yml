name: CI Build and Tests

on:
  pull_request:
    paths-ignore:
      - 'infra/**'
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies & Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q || true
