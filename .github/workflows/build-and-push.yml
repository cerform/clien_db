name: Build and Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub (or set up a registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
      - name: Build and push admin-ui image
        uses: docker/build-push-action@v5
        with:
          context: services/frontend/admin-ui
          file: services/frontend/admin-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:admin-ui-${{ github.sha }}
            ghcr.io/${{ github.repository }}:admin-ui-latest
