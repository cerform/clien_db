<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Веб-интерфейс Анализатор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 1px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #30363d;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
            padding: 15px 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 2px solid #30363d;
        }

        .logs {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #0d1117;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.4;
            border-left: 3px solid #30363d;
        }

        .log-entry.info {
            border-left-color: #58a6ff;
            background: rgba(88, 166, 255, 0.1);
        }

        .log-entry.success {
            border-left-color: #3fb950;
            background: rgba(63, 185, 80, 0.1);
            color: #3fb950;
        }

        .log-entry.error {
            border-left-color: #f85149;
            background: rgba(248, 81, 73, 0.1);
            color: #f85149;
        }

        .log-entry.warning {
            border-left-color: #d29922;
            background: rgba(210, 153, 34, 0.1);
            color: #d29922;
        }

        .log-entry.request {
            border-left-color: #79c0ff;
            background: rgba(121, 192, 255, 0.1);
        }

        .timestamp {
            color: #8b949e;
            margin-right: 8px;
        }

        .stats {
            background: #161b22;
            padding: 15px;
            border-top: 2px solid #30363d;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-item {
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
        }

        .stat-label {
            color: #8b949e;
            display: block;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #58a6ff;
        }

        .controls {
            background: #161b22;
            padding: 10px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 5px;
        }

        button {
            flex: 1;
            padding: 8px;
            background: #238636;
            color: white;
            border: 1px solid #2ea043;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
        }

        button:hover {
            background: #2ea043;
        }

        button.clear {
            background: #da3633;
            border-color: #f85149;
        }

        button.clear:hover {
            background: #f85149;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        .status-indicator.online {
            background: #3fb950;
        }

        .status-indicator.offline {
            background: #f85149;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .endpoints {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            padding: 10px;
            background: #161b22;
            border-top: 1px solid #30363d;
            max-height: 150px;
            overflow-y: auto;
        }

        .endpoint-btn {
            padding: 6px;
            background: #0d3cc4;
            color: #79c0ff;
            border: 1px solid #1f6feb;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            text-align: left;
        }

        .endpoint-btn:hover {
            background: #1f6feb;
        }

        .endpoint-btn.status-200 {
            border-left: 3px solid #3fb950;
        }

        .endpoint-btn.status-404 {
            border-left: 3px solid #f85149;
        }

        .endpoint-btn.status-loading {
            border-left: 3px solid #d29922;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logs Panel -->
        <div class="panel" style="flex: 2;">
            <div class="header">🔍 ЛОГИ РЕАЛ-ТАЙМ (System Console)</div>
            <div class="logs" id="logs"></div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Всего событий</span>
                    <span class="stat-value" id="total-events">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Ошибок</span>
                    <span class="stat-value" id="error-count" style="color: #f85149;">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">API запросов</span>
                    <span class="stat-value" id="api-count" style="color: #79c0ff;">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Статус</span>
                    <span class="stat-value"><span class="status-indicator online"></span>Online</span>
                </div>
            </div>
            <div class="controls">
                <button onclick="clearLogs()">🗑️ Очистить логи</button>
                <button onclick="exportLogs()">💾 Экспортировать</button>
            </div>
        </div>

        <!-- Monitoring Panel -->
        <div class="panel" style="flex: 1;">
            <div class="header">📊 МОНИТОРИНГ ЭНДПОИНТОВ</div>
            <div class="endpoints" id="endpoints"></div>
            <div style="flex: 1; overflow-y: auto; padding: 15px;">
                <div style="font-size: 12px; color: #8b949e;">
                    <p style="margin-bottom: 10px;"><strong>✅ Статус системы:</strong></p>
                    <p style="margin-bottom: 5px;">🟢 Веб-интерфейс: <span id="web-status" style="color: #3fb950;">Online</span></p>
                    <p style="margin-bottom: 5px;">🟢 API: <span id="api-status" style="color: #3fb950;">Доступен</span></p>
                    <p style="margin-bottom: 10px;">🟢 БД: <span id="db-status" style="color: #3fb950;">Готова</span></p>
                    <p style="margin-bottom: 5px;">🔎 Мониторинг: <span id="monitor-status" style="color: #3fb950;">-</span></p>
                    
                    <p style="margin-bottom: 10px;"><strong>📈 Метрики:</strong></p>
                    <p>Время ответа: <span id="response-time">-</span>ms</p>
                    <p>Обновлено: <span id="last-update">-</span></p>
                </div>
            </div>
            <div class="controls">
                <button onclick="testAllEndpoints()" style="background: #0d3cc4; border-color: #1f6feb;">🧪 Тест эндпоинтов</button>
                <button onclick="runMonitoringChecks()" style="background: #ff9f1a; border-color: #ffb86b;">🔎 Run Monitoring</button>
                <button onclick="location.reload()" style="background: #238636; border-color: #2ea043;">🔄 Обновить</button>
            </div>
        </div>
    </div>

    <script>
        var logsContainer = window.logsContainer || document.getElementById('logs');
        window.logsContainer = logsContainer;
        var endpointsContainer = window.endpointsContainer || document.getElementById('endpoints');
        window.endpointsContainer = endpointsContainer;
        var logs = window.logs || [];
        var eventCount = window.eventCount || 0;
        var errorCount = window.errorCount || 0;
        var apiCount = window.apiCount || 0;

        const endpoints = [
            { name: 'Health', url: '/api/health' },
            { name: 'Stats', url: '/api/stats' },
            { name: 'Masters', url: '/api/masters' },
            { name: 'Services', url: '/api/services' },
            { name: 'Clients', url: '/api/clients' },
            { name: 'Bookings', url: '/api/bookings' },
            { name: 'Admin Dashboard', url: '/admin' },
            { name: 'Masters Page', url: '/admin/masters' },
            { name: 'Monitoring Checks', url: '/api/monitoring/checks' },
        ];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('ru-RU');
            const entry = { message, type, timestamp };
            logs.unshift(entry);
            eventCount++;

            if (type === 'error') errorCount++;
            if (type === 'request') apiCount++;

            // Keep only last 100 logs
            if (logs.length > 100) logs.pop();

            renderLogs();
            updateStats();
            window.logs = logs; window.eventCount = eventCount; window.errorCount = errorCount; window.apiCount = apiCount;
        }

        function renderLogs() {
            logsContainer.innerHTML = logs.map(log => `
                <div class="log-entry ${log.type}">
                    <span class="timestamp">[${log.timestamp}]</span>
                    ${log.message}
                </div>
            `).join('');
            logsContainer.scrollTop = 0;
        }

        function updateStats() {
            document.getElementById('total-events').textContent = eventCount;
            document.getElementById('error-count').textContent = errorCount;
            document.getElementById('api-count').textContent = apiCount;
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('ru-RU');
        }

        function clearLogs() {
            logs = [];
            eventCount = 0;
            errorCount = 0;
            apiCount = 0;
            renderLogs();
            updateStats();
            window.logs = logs; window.eventCount = eventCount; window.errorCount = errorCount; window.apiCount = apiCount;
            addLog('✅ Логи очищены', 'success');
        }

        function exportLogs() {
            const text = logs.map(l => `[${l.timestamp}] [${l.type.toUpperCase()}] ${l.message}`).join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `logs-${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            addLog('📥 Логи экспортированы', 'success');
        }

        async function testEndpoint(endpoint) {
            try {
                const startTime = performance.now();
                const response = await fetch(endpoint.url, { signal: AbortSignal.timeout(5000) });
                const duration = Math.round(performance.now() - startTime);

                const status = response.status;
                const statusClass = status === 200 ? 'status-200' : 'status-404';
                
                addLog(`🌐 ${endpoint.name}: ${endpoint.url} → ${status} (${duration}ms)`, 'request');
                
                return { endpoint, status, duration };
            } catch (error) {
                addLog(`❌ ${endpoint.name}: ${error.message}`, 'error');
                return { endpoint, status: 'error', duration: '-' };
            }
        }

        async function runMonitoringChecks() {
            addLog('🧪 Запуск проверок мониторинга...', 'warning');
            try {
                const resp = await fetch('/api/monitoring/checks');
                const data = await resp.json();
                const ok = data.ok;
                addLog(`✅ Мониторинг: ok=${ok}`, ok ? 'success' : 'error');
                const monitorStatusText = ok ? 'OK' : 'FAIL';
                const monitorElem = document.getElementById('monitor-status');
                if (monitorElem) monitorElem.textContent = monitorStatusText;
                Object.entries(data.results || {}).forEach(([name, info]) => {
                    addLog(`🔍 ${name}: ${info.status} ${info.ok ? 'OK' : 'FAIL'}`, info.ok ? 'success' : 'error');
                });
            } catch (e) {
                addLog(`❌ Ошибка мониторинга: ${e.message}`, 'error');
            }
        }

        async function testAllEndpoints() {
            addLog('🧪 Начинаю тестирование всех эндпоинтов...', 'warning');
            for (const endpoint of endpoints) {
                await testEndpoint(endpoint);
                await new Promise(r => setTimeout(r, 300));
            }
            addLog('✅ Тестирование завершено', 'success');
        }

        function renderEndpoints() {
            endpointsContainer.innerHTML = endpoints.map(ep => `
                <button class="endpoint-btn status-loading" onclick="testEndpoint({name: '${ep.name}', url: '${ep.url}'})">
                    📍 ${ep.name}
                </button>
            `).join('');
        }

        // Перехватываем console методы
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            originalLog(...args);
            addLog(`📝 ${args.join(' ')}`, 'info');
        };

        console.error = function(...args) {
            originalError(...args);
            addLog(`❌ ${args.join(' ')}`, 'error');
        };

        console.warn = function(...args) {
            originalWarn(...args);
            addLog(`⚠️  ${args.join(' ')}`, 'warning');
        };

        // Инициализация
        addLog('🚀 Анализатор веб-интерфейса запущен', 'success');
        renderEndpoints();
        
        // Автотест каждые 30 секунд
        setInterval(testAllEndpoints, 30000);
        
        // Первый тест сразу
        setTimeout(testAllEndpoints, 2000);
        // Automatic monitoring checks every 60 seconds
        setInterval(runMonitoringChecks, 60000);
        setTimeout(runMonitoringChecks, 5000);

        // Перехватываем fetch запросы
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            const url = args[0];
            addLog(`📤 Fetch: ${url}`, 'request');
            return originalFetch.apply(this, args)
                .then(response => {
                    addLog(`📥 Response: ${url} → ${response.status}`, 
                        response.status >= 400 ? 'error' : 'success');
                    return response;
                })
                .catch(error => {
                    addLog(`❌ Fetch Error: ${url} → ${error.message}`, 'error');
                    throw error;
                });
        };

        // Отслеживаем ошибки на странице
        window.addEventListener('error', (event) => {
            addLog(`💥 JavaScript Error: ${event.message}`, 'error');
        });

        window.addEventListener('unhandledrejection', (event) => {
            addLog(`💥 Promise Error: ${event.reason}`, 'error');
        });

        updateStats();
    </script>
</body>
</html>
