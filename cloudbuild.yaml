# Google Cloud Build configuration for deploying to Cloud Run
substitutions:
  _REGION: "europe-west1"
  _SERVICE_NAME: "tattoo-bot"
  _CLOUDSQL_INSTANCE: "tattoo-bot-db"
  _DATABASE_URL: ""  # optionally set via trigger substitution or secret
steps:
  # Run pre-deploy checks in Cloud Build
  - name: 'python:3.10'
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt --no-cache-dir
        python3 scripts/predeploy_check.py
        python3 scripts/validate_env.py || true
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}']

  # Smoke-test the built image by running it and checking /api/health
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'run'
      - '-d'
      - '--name'
      - '${_SERVICE_NAME}_smoke'
      - '-p'
      - '8080:8080'
      - '-e'
      - 'PORT=8080'
      - '-e'
      - 'BOT_MODE=inka'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Wait for container to start and health endpoint to respond
        for i in {1..30}; do
          if curl -sS --fail http://localhost:8080/api/health; then
            echo "Health check OK"; break
          fi
          sleep 1
        done
        if ! curl -sS --fail http://localhost:8080/api/health; then
          echo "Health check failed; aborting build"; exit 1
        fi

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'rm'
      - '-f'
      - '${_SERVICE_NAME}_smoke'

  # Optional: run SQL migrations and RBAC creation using the built image (requires _DATABASE_URL substitution or secret)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "${_DATABASE_URL}" ]; then
          echo "Running DB migrations in container (apply)..."
          else
            echo "No _DATABASE_URL substitution set on build trigger; skipping migrations & RBAC creation"
            exit 0
            fi
            set -e
            docker run --rm -e DATABASE_URL="${_DATABASE_URL}" --entrypoint python3 gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest scripts/apply_sql_migrations.py --apply
            echo "Creating RBAC roles..."
            docker run --rm -e DATABASE_URL="${_DATABASE_URL}" --entrypoint python3 gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest scripts/create_rbac_roles.py --apply

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--add-cloudsql-instances'
      - "$PROJECT_ID:${_REGION}:${_CLOUDSQL_INSTANCE}"
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'CLOUD_RUN_ENV=true,DB_SOCKET_DIR=/cloudsql'

  # Optional: run SQL migrations and RBAC creation using the built image (requires _DATABASE_URL substitution or secret)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "${_DATABASE_URL}" ]; then
          echo "Running DB migrations in container (apply)..."
          docker run --rm -e DATABASE_URL="${_DATABASE_URL}" --entrypoint python3 gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest scripts/apply_sql_migrations.py --apply
          echo "Creating RBAC roles..."
          docker run --rm -e DATABASE_URL="${_DATABASE_URL}" --entrypoint python3 gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest scripts/create_rbac_roles.py --apply
        else
          echo "No _DATABASE_URL substitution set on build trigger; skipping migrations & RBAC creation"
        fi
    - name: 'gcr.io/cloud-builders/docker'
      entrypoint: 'bash'
      args:
        - '-c'
        - |
          set -e
          if [ -n "${_DATABASE_URL}" ]; then
            echo "Running DB migrations in container (apply)..."
            docker run --rm -e DATABASE_URL="${_DATABASE_URL}" --entrypoint python3 gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest scripts/apply_sql_migrations.py --apply
            echo "Creating RBAC roles..."
            docker run --rm -e DATABASE_URL="${_DATABASE_URL}" --entrypoint python3 gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest scripts/create_rbac_roles.py --apply
          else
            echo "No _DATABASE_URL substitution set on build trigger; skipping migrations & RBAC creation"
          fi

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BUILD_ID'
options:
  substitutionOption: 'ALLOW_LOOSE'

# Cloud Build timeout
timeout: '1200s'
