{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>Database Admin</h1>
  <p>Select sheet to manage:</p>
  <select id="sheet-select">
    <option value="clients">clients</option>
    <option value="masters">masters</option>
    <option value="services">services</option>
    <option value="bookings">bookings</option>
    <option value="config">config</option>
    <option value="conversations">conversations</option>
    <option value="calendar">calendar</option>
  </select>

  <div id="table"></div>
  <div style="display:flex;gap:8px;align-items:center;margin:8px 0">
    <input id="admin-db-search" placeholder="Search..." style="padding:6px;border:1px solid #ccc;border-radius:4px">
    <button id="reload">Reload</button>
    <button id="add-row">Add Row</button>
  </div>
  <button id="sync-admins">Sync Admins from DB</button>
  <!-- Audit modal -->
  <div id="audit-modal" style="display:none; position:fixed; left:50%; top:10%; transform:translateX(-50%); width:80%; background:white; border:1px solid #ccc; padding:20px; z-index:9999;">
    <h3>Audit history for <span id="audit-sheet"></span> / <span id="audit-row"></span></h3>
    <div id="audit-table"></div>
    <div>
      <button id="audit-prev">Prev</button>
      <button id="audit-next">Next</button>
      <button id="audit-export">Export CSV</button>
      <button id="audit-close">Close</button>
    </div>
    <div style="margin-top:10px"><button id="rollback-entry">Rollback to selected</button></div>
  </div>
</div>

<!-- Edit Row Modal (Field-based editor) -->
<div class="modal-overlay" id="adminEditModal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2>Edit Row</h2>
      <button class="modal-close" data-modal-close>&times;</button>
    </div>
    <div class="modal-body">
      <form id="admin-edit-form">
        <div id="admin-edit-fields" class="form-grid"></div>
        <div id="admin-edit-errors" style="color:#b71c1c;margin-top:8px"></div>
        <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
          <button id="admin-edit-cancel" type="button" class="btn">Cancel</button>
          <button id="admin-edit-save" type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<link href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
<script src="/static/js/admin_db.js"></script>

{% endblock %}
