<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tattoo Salon Management System">
    <title>{% block title %}Tattoo Salon{% endblock %}</title>

    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS - Universal Style System -->
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="/static/css/universal.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    {% block extra_css %}{% endblock %}

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#1a1b1e">
</head>
<body>
    <!-- Mobile overlay for sidebar -->
    <div class="mobile-overlay"></div>

    <!-- Main layout -->
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-logo">
                    <div class="sidebar-logo-icon">✂️</div>
                    <span>Tattoo Salon</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <!-- Dashboard Section -->
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Главное</div>
                    <a href="/" class="sidebar-link active" data-spa-tab="dashboard">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        <span>Главная</span>
                    </a>
                    <a href="/calendar" class="sidebar-link">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <span>Календарь</span>
                        <span class="sidebar-badge">5</span>
                    </a>
                </div>

                <!-- Management Section -->
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Управление</div>
                    <a href="#" class="sidebar-link" data-spa-tab="clients">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                        <span>Клиенты</span>
                    </a>
                    <a href="#" class="sidebar-link" data-spa-tab="masters">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                        <span>Мастера</span>
                    </a>
                    <a href="#" class="sidebar-link" data-spa-tab="bookings">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                        </svg>
                        <span>Записи</span>
                    </a>
                </div>

                <!-- Settings Section -->
                <div class="sidebar-section">
                    <div class="sidebar-section-title">Настройки</div>
                    <a href="#" class="sidebar-link" data-spa-tab="services">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <span>Услуги</span>
                    </a>
                    <a href="#" class="sidebar-link" data-spa-tab="training">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                        <span>Обучение INKA</span>
                    </a>
                    <a href="/admin/endpoints" class="sidebar-link">
                        <svg class="sidebar-link-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M3 12h18M3 17h18"/>
                        </svg>
                        <span>Endpoints</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar">ВП</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">Владимир Петров</div>
                        <div class="sidebar-user-role">СуперАдмин</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main-content">
            <!-- Top bar -->
            <header class="topbar">
                <button class="topbar-menu-toggle" aria-label="Toggle menu">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <div class="topbar-search">
                    <input type="search" class="input" placeholder="Поиск...">
                </div>

                <div class="topbar-actions">
                    <!-- Notifications -->
                    <button class="button-icon button-ghost" data-tooltip="Уведомления">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                        </svg>
                    </button>
                    <button id="admin-tools-btn" class="btn" title="Admin tools">Admin</button>
                </div>
            </header>

            <!-- Page content -->
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/theme-manager.js"></script>
    <script src="/static/js/app.js"></script>
    <!-- Admin tools modal -->
    <div class="modal-overlay" id="adminToolsModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h2>Admin Tools</h2>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Admin token</label><input id="admin-token-input" class="form-input" placeholder="admin_token_local"/></div>
                <div class="form-group"><button id="save-admin-token" class="btn btn-primary">Save token (localStorage)</button></div>
                <hr/>
                <div class="form-group"><button id="clear-admin-token" class="btn">Clear token</button></div>
                <hr/>
                <div class="form-group"><button id="run-services-seed" class="btn btn-warning">Run services seed (admin)</button></div>
                <div id="admin-tools-result" style="margin-top:12px; font-size:0.9rem"></div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('admin-tools-btn').addEventListener('click', ()=>{ app.openModal('adminToolsModal'); document.getElementById('admin-token-input').value = localStorage.getItem('inka_admin_token') || ''; document.getElementById('admin-tools-result').innerText = ''; });
        document.getElementById('save-admin-token').addEventListener('click', ()=>{ const v = document.getElementById('admin-token-input').value; localStorage.setItem('inka_admin_token', v); document.getElementById('admin-tools-result').innerText = 'Saved token locally'; });
        document.getElementById('clear-admin-token').addEventListener('click', ()=>{ localStorage.removeItem('inka_admin_token'); document.getElementById('admin-tools-result').innerText = 'Cleared token'; });
        document.getElementById('run-services-seed').addEventListener('click', async ()=>{
            const token = localStorage.getItem('inka_admin_token'); const headers = {'Content-Type':'application/json'}; if (token) headers['Authorization'] = 'Bearer ' + token;
            document.getElementById('admin-tools-result').innerText = 'Running...';
            try{
                const res = await fetch('/api/admin/run_services_seed', {method:'POST', headers});
                if (res.ok) document.getElementById('admin-tools-result').innerText = 'Seed completed successfully'; else { const txt = await res.text(); document.getElementById('admin-tools-result').innerText = 'Failed: ' + txt }
            }catch(e){ document.getElementById('admin-tools-result').innerText = 'Error: '+e.message }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
