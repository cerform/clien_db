# Local environment configuration template for clien_db
# Do NOT store secrets in this file when committing. Copy it to 'env.yaml' or '.env' locally and fill in.

# Google / GCP
GOOGLE_APPLICATION_CREDENTIALS: 
GOOGLE_PROJECT_ID: 
GOOGLE_SPREADSHEET_ID: 
GOOGLE_CALENDAR_ID: 

# Bot & admin
TELEGRAM_BOT_TOKEN: ""
ADMIN_IDS: ""

# OpenAI / Assistants
OPENAI_API_KEY: ""
OPENAI_ASSISTANT_ID: "" # optional

# Deployment / Other
APP_PORT: 8000
LOG_LEVEL: INFO

# Local DB / Runtime
RUN_LOCAL_SPREADSHEET: true

# Notes:
# Fill the values above locally. Do not check in 'env.yaml' or any file that contains real keys.
# Use a secrets manager for CI/CD and production environments (GCP Secret Manager, GitHub Secrets, etc.)
