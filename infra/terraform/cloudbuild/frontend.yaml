steps:
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --no-cache-dir -r services/frontend/requirements.txt || true
        pytest -q services/frontend || true

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tattoo-frontend:$SHORT_SHA', '.']
    dir: 'services/frontend'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tattoo-frontend:$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy tattoo-frontend-staging \
          --image=gcr.io/$PROJECT_ID/tattoo-frontend:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --service-account=${_FE_SA} --quiet

        sleep 5
        STAGING_URL=$(gcloud run services describe tattoo-frontend-staging --region=${_REGION} --format='value(status.url)')
        if ! curl -s --fail ${STAGING_URL}/; then
          echo "Staging smoke test failed"; exit 1
        fi

        gcloud run deploy tattoo-frontend \
          --image=gcr.io/$PROJECT_ID/tattoo-frontend:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --service-account=${_FE_SA} --quiet
substitutions:
  _REGION: "us-central1"
  _FE_SA: "tattoo-frontend-sa@${PROJECT_ID}.iam.gserviceaccount.com"
timeout: '1200s'
