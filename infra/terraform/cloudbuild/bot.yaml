steps:
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --no-cache-dir -r services/bot/requirements.txt || true
        pytest -q services/bot || true

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tattoo-bot:$SHORT_SHA', '.']
    dir: 'services/bot'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tattoo-bot:$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy tattoo-bot-staging \
          --image=gcr.io/$PROJECT_ID/tattoo-bot:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --service-account=${_BOT_SA} --set-env-vars "CLOUD_RUN_ENV=true" --add-cloudsql-instances=${_CLOUDSQL_CONN} --quiet

        sleep 5
        STAGING_URL=$(gcloud run services describe tattoo-bot-staging --region=${_REGION} --format='value(status.url)')
        if ! curl -s --fail ${STAGING_URL}/api/health; then
          echo "Staging smoke test failed"; exit 1
        fi

        gcloud run deploy tattoo-bot \
          --image=gcr.io/$PROJECT_ID/tattoo-bot:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --service-account=${_BOT_SA} --set-env-vars "CLOUD_RUN_ENV=true" --add-cloudsql-instances=${_CLOUDSQL_CONN} --quiet
substitutions:
  _REGION: "us-central1"
  _BOT_SA: "tattoo-bot-sa@${PROJECT_ID}.iam.gserviceaccount.com"
  _CLOUDSQL_CONN: "tattoo-480007:us-central1:tattoo-db"
timeout: '1200s'
