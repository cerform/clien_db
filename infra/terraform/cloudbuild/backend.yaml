steps:
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install --no-cache-dir -r services/backend/requirements.txt
        pytest -q services/backend || true

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tattoo-backend:$SHORT_SHA', '.']
    dir: 'services/backend'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tattoo-backend:$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Deploy to staging first
        gcloud run deploy tattoo-backend-staging \
          --image=gcr.io/$PROJECT_ID/tattoo-backend:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --service-account=${_BACKEND_SA} --quiet

        # Wait a bit and smoke test staging
        sleep 5
        STAGING_URL=$(gcloud run services describe tattoo-backend-staging --region=${_REGION} --format='value(status.url)')
        if ! curl -s --fail ${STAGING_URL}/api/health; then
          echo "Staging smoke test failed"; exit 1
        fi

        # Run migrations using Cloud Run Job (create/replace then execute)
        echo "Creating migrator job..."
        gcloud run jobs replace --image=gcr.io/$PROJECT_ID/tattoo-backend:$SHORT_SHA tattoo-backend-migrator --region=${_REGION} --command python --args src/db/init_postgres.py || \
          gcloud run jobs create --image=gcr.io/$PROJECT_ID/tattoo-backend:$SHORT_SHA tattoo-backend-migrator --region=${_REGION} --command python --args src/db/init_postgres.py --quiet
        gcloud run jobs execute tattoo-backend-migrator --region=${_REGION} --wait --quiet

        # Deploy to production
        gcloud run deploy tattoo-backend \
          --image=gcr.io/$PROJECT_ID/tattoo-backend:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --service-account=${_BACKEND_SA} --quiet
substitutions:
  _REGION: "us-central1"
  _BACKEND_SA: "tattoo-backend-sa@${PROJECT_ID}.iam.gserviceaccount.com"
timeout: '1200s'
